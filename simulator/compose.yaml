services:
  main:
    image: kibble-main:latest
    container_name: kibble-main-container
    environment:
      - CONN_STR=mongodb://root:password@database.internal
    networks:
      kibble-sim-network:
        ipv4_address: 10.1.0.0
    build:
      context: ../
      dockerfile: ./simulator/main/Dockerfile
    depends_on:
      - database
    # extra_hosts:
    #   - "database:database.internal"

  secondary:
    image: kibble-secondary:latest
    networks:
      - kibble-sim-network
    build:
      context: ./secondary
      dockerfile: Dockerfile
  database:
    image: mongodb/mongodb-community-server:8.2.3-ubi8
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=password
    container_name: kibble-mongodb
    networks:
      kibble-sim-network:
        ipv4_address: 10.1.0.2
        aliases:
          - database.internal
    volumes:
      - type: bind
        source: ./db
        target: /data/db

networks:
  kibble-sim-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.0.0/8
          ip_range: 10.128.0.0/9
